on:
  push:
    branches:
      - main
    paths:
      - "lib/jekyll/tagging/related_posts/version.rb"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'toshimaru/jekyll-tagging-related_posts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby
      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
      - name: Create GitHub Release
        run: gh release create "$(git describe --tags --abbrev=0)" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
